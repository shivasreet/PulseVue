
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invalid Image | PulseVue</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f7ef;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .warning-card {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 45px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .warning-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #b45309;
            margin-bottom: 15px;
            font-size: 27px;
        }

        p {
            color: #647067;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .confidence {
            font-size: 14px;
        }

        a {
            display: inline-block;
            background: #315c35;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background: #244729;
        }
    </style>
</head>

<body>

    <div class="warning-card">

        <div class="warning-icon">⚠️</div>

        <h1>Invalid Image</h1>

        <p>
            No Chickpeas Identified. The uploaded image does not
            appear to contain chickpeas according to our image classifier.
        </p>

        <p class="confidence">
            Classification confidence: {{ confidence }}%
        </p>

        <p>
            Please upload an image containing chickpeas
            to continue the analysis.
        </p>

        <a href="{{ url_for('upload_page') }}">
            Upload Another Image
        </a>

    </div>

</body>
</html>
